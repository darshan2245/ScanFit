  <style>
    body {
      background-color: #09101C;
      color: #F6F4EE;
      font-family: 'DM Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #060B13;
    }
    ::-webkit-scrollbar-thumb {
      background: #233755;
      border-radius: 9999px;
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view-animate {
      animation: viewFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 6px #FF6B35); }
      50% { transform: scale(1.08, 0.95) rotate(-2deg); filter: drop-shadow(0 0 10px #FF8855); }
    }
    .flame-anim {
      animation: flameFlicker 1.8s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes muscleGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 107, 53, 0.7)); opacity: 0.95; }
      50% { filter: drop-shadow(0 0 12px rgba(255, 107, 53, 1)); opacity: 1; }
    }
    .pulse-muscle {
      animation: muscleGlow 2.2s infinite ease-in-out;
    }

    /* Exercise Demo Loop Keyframes */
    @keyframes latPull {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(32px); }
    }
    @keyframes chestPress {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(28px); }
    }
    @keyframes legPress {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-22px, -22px); }
    }
    @keyframes legExt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-60deg); }
    }
    @keyframes legCurl {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(70deg); }
    }
    @keyframes cableRow {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-26px); }
    }
    @keyframes shoulderPress {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }
    @keyframes dbPress {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(0, -26px) scale(0.96); }
    }
    @keyframes rdlHinge {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(35deg); }
    }
    @keyframes tricepPush {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(65deg); }
    }
    @keyframes bicepCurl {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-70deg); }
    }
    @keyframes abCrunch {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(25deg); }
    }

    .anim-lat { animation: latPull 2.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .anim-chest { animation: chestPress 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .anim-legpress { animation: legPress 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .anim-legext { animation: legExt 2.6s cubic-bezier(0.35, 0, 0.25, 1) infinite; transform-origin: 165px 145px; }
    .anim-legcurl { animation: legCurl 2.6s cubic-bezier(0.35, 0, 0.25, 1) infinite; transform-origin: 125px 145px; }
    .anim-row { animation: cableRow 2.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .anim-shoulder { animation: shoulderPress 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .anim-dbpress { animation: dbPress 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .anim-rdl { animation: rdlHinge 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 160px 140px; }
    .anim-tricep { animation: tricepPush 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 165px 95px; }
    .anim-bicep { animation: bicepCurl 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 155px 125px; }
    .anim-crunch { animation: abCrunch 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 160px 145px; }

    .anim-paused * { animation-play-state: paused !important; }
    .anim-slow * { animation-duration: 5.2s !important; }

    @media print {
      body { background-color: #fff !important; color: #000 !important; }
      header, nav, #toast, .no-print { display: none !important; }
      #app-container { max-width: 100% !important; padding: 0 !important; }
      .qr-print-card { border: 2px dashed #000 !important; background: #fff !important; color: #000 !important; page-break-inside: avoid; }
    }
  </style>
</head>

          t.classList.remove('translate-y-0', 'opacity-100');

        ['nav-machines', 'nav-diet', 'nav-tracker', 'nav-streaks', 'nav-admin'].forEach(navId => {
          const el = document.getElementById(navId);
          if (el) {
            if (navId === id) {
              el.classList.add('text-orange-accent', 'font-bold');
              el.classList.remove('text-cream-300');

              el.classList.remove('text-orange-accent', 'font-bold');
              el.classList.add('text-cream-300');

      // --- ROUTING DISPATCHER WITH STRICT AUTH WALL ---
      router() {
        const hash = window.location.hash || '#/';
        const container = document.getElementById('app-container');
        const bottomNav = document.getElementById('bottomNavBar');

        // STRICT GATE: If user is not logged in, force the login view and hide nav
        if (!this.user) {
          if (bottomNav) bottomNav.classList.add('hidden');
          this.renderLoginView(container);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        // User is authenticated: Show bottom navigation and allow route access
        if (bottomNav) bottomNav.classList.remove('hidden');

        if (hash === '#/' || hash === '' || hash === '#/login') {
          this.setActiveNav('nav-machines');
          this.renderCatalog(container);
        } else if (hash.startsWith('#/machine/')) {
          const id = hash.replace('#/machine/', '').trim();
          this.setActiveNav('nav-machines');
          this.renderMachineDetail(container, id);
        } else if (hash === '#/diet') {
          this.setActiveNav('nav-diet');
          this.renderDietPlanner(container);
        } else if (hash === '#/tracker') {
          this.setActiveNav('nav-tracker');
          this.renderTracker(container);
        } else if (hash === '#/streaks') {
          this.setActiveNav('nav-streaks');
          this.renderStreaks(container);
        } else if (hash === '#/admin-qr') {
          this.setActiveNav('nav-admin');
          this.renderAdminQr(container);
        } else {
          window.location.hash = '#/';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      handleManualAuth(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmailInput').value.trim().toLowerCase();
        const name = document.getElementById('loginNameInput').value.trim();

        if (!email.endsWith('@iitdh.ac.in')) {
          this.showToast('Rejected: Must end with @iitdh.ac.in');
          return;
        }

        this.user = {
          name,
          email,
          rollNo: email.split('@')[0],
          loginTime: new Date().toISOString()
        };

        localStorage.setItem('scanfit_auth_user', JSON.stringify(this.user));
        this.updateHeaderAuth();
        this.showToast(`Welcome, ${name}!`);
        window.location.hash = '#/';

      // Flexible Video Player: Detects Google Drive, YouTube, or direct MP4
      renderMachineVideoPlayer(machine) {
        const vUrl = (machine.videoUrl || '').trim();
        const yId = (machine.youtubeId || '').trim();

        // 1. Google Drive Link: Extract file ID and embed Drive preview player
        if (vUrl.includes('drive.google.com')) {
          let driveId = '';
          const match = vUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || vUrl.match(/id=([a-zA-Z0-9_-]+)/);
          if (match) driveId = match[1];

          if (driveId) {
            return `
              <iframe 
                class="w-full h-full rounded-2xl border-0" 
                src="https://drive.google.com/file/d/${driveId}/preview" 
                title="${machine.name} Google Drive Workout Video" 
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen
              ></iframe>
            `;
          }
        }

        // 2. Direct MP4 Video File or Data URI
        if (vUrl.startsWith('data:video') || vUrl.endsWith('.mp4') || vUrl.endsWith('.webm')) {
          return `
            <video 
              autoplay loop muted playsinline controls 
              class="w-full h-full object-contain rounded-2xl"
            >
              <source src="${vUrl}" type="video/mp4">
            </video>
          `;
        }

        // 3. YouTube Embed Fallback
        if (yId) {
          return `
            <iframe 
              class="w-full h-full rounded-2xl border-0"
              src="https://www.youtube-nocookie.com/embed/${yId}?autoplay=0&controls=1&rel=0&modestbranding=1" 
              title="${machine.name} Real Workout Demonstration" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen
            ></iframe>
          `;
        }

        return `
          <div class="flex flex-col items-center justify-center p-6 text-center text-cream-300">
            <i class="fa-solid fa-film text-2xl text-orange-accent mb-2"></i>
            <p class="text-xs">No video URL configured</p>
          </div>
        `;
      }

      togglePlayState() {
        this.animPlaying = !this.animPlaying;
        const text = document.getElementById('guidePlayText');
        const icon = document.querySelector('#guidePlayBtn i');
        const stage = document.getElementById('svgMotionStage');

        if (this.animPlaying) {
          if (stage) stage.classList.remove('anim-paused');
          if (text) text.textContent = 'Pause';
          if (icon) icon.className = 'fa-solid fa-pause text-[10px]';
        } else {
          if (stage) stage.classList.add('anim-paused');
          if (text) text.textContent = 'Play';
          if (icon) icon.className = 'fa-solid fa-play text-[10px]';
        }
      }

      toggleSpeedState() {
        const btn = document.getElementById('guideSpeedBtn');
        const stage = document.getElementById('svgMotionStage');

        if (this.animSpeed === 'normal') {
          this.animSpeed = 'slow';
          if (btn) btn.textContent = '0.5x';
          if (stage) stage.classList.add('anim-slow');
        } else {
          this.animSpeed = 'normal';
          if (btn) btn.textContent = '1.0x';
          if (stage) stage.classList.remove('anim-slow');
        }
      }

      calculateDietPlan({ age, gender, heightCm, weightKg, activityMultiplier, goal, dietPref }) {
        const heightM = heightCm / 100;
        const bmi = +(weightKg / (heightM * heightM)).toFixed(1);
        let bmiCategory = 'Normal weight';
        if (bmi < 18.5) bmiCategory = 'Underweight';
        else if (bmi >= 25 && bmi < 29.9) bmiCategory = 'Overweight';
        else if (bmi >= 30) bmiCategory = 'Obese';

        // Mifflin-St Jeor formula
        let bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age);
        bmr = gender === 'male' ? Math.round(bmr + 5) : Math.round(bmr - 161);

        const tdee = Math.round(bmr * activityMultiplier);

        let targetCalories = tdee;
        if (goal === 'cut') targetCalories = tdee - 400;
        if (goal === 'bulk') targetCalories = tdee + 350;

        // Protein: 1.8g/kg
        const proteinGrams = Math.round(weightKg * 1.8);
        const proteinCalories = proteinGrams * 4;

        // Fat: 25% of calories
        const fatCalories = Math.round(targetCalories * 0.25);
        const fatGrams = Math.round(fatCalories / 9);

        // Carbs: Remainder
        const carbCalories = Math.max(0, targetCalories - proteinCalories - fatCalories);
        const carbGrams = Math.round(carbCalories / 4);

        // Daily Water Recommendation: ~35ml/kg + 500ml for workout
        const waterLiters = +((weightKg * 0.035) + 0.5).toFixed(1);

                const messTips = [];
        if (dietPref === 'veg') {
          // --- IIT DHARWAD HOSTEL MESS MENU (VEGETARIAN) ---

          messTips.push({ item: '[Lunch & Dinner] Curd / Lassi / Solkadhi', portion: '1-2 cups daily', reason: 'Lassi (Mon), Solkadhi (Wed), Curd Rice (Sat) for probiotic digestion' });
          messTips.push({ item: '[Snacks - 4:30 pm] Bananas & Cut Fruits', portion: '1-2 bananas + tea', reason: 'Clean pre-workout glycogen fuel before evening gym sessions' });
          messTips.push({ item: '[Dinner Special] Kadhai Paneer & Dal Fry', portion: 'Full katori (Wed dinner)', reason: 'Dense vegetarian muscle recovery on mid-week training days' });
          messTips.push({ item: '[Dinner Special] Paneer Butter Masala', portion: 'Full katori (Fri dinner)', reason: 'High-calorie & casein recovery ahead of weekend workouts' });
          messTips.push({ item: '[Dinner Special] Soya Bean Masala & Paneer Chilli', portion: '4 pcs paneer + soya (Sat)', reason: 'Highest vegetarian protein meal of the week (30g+ protein)' });
          messTips.push({ item: '[Dinner] Sprouts Aloo Methi & Palak Corn', portion: '1 plate (Mon & Tue)', reason: 'Micronutrients, dietary iron & magnesium for muscle repair' });
        } else {
          // --- IIT DHARWAD HOSTEL MESS MENU (NON-VEG / EGGITARIAN) ---
          messTips.push({ item: '[Breakfast] Boiled Eggs (Mess Counter)', portion: '3-4 eggs (Sun, Mon, Wed, Thu, Sat)', reason: '18-24g bioavailable albumin protein to kickstart recovery' });
          messTips.push({ item: '[Breakfast] Egg Bhurji & Omelette Days', portion: 'Full portion (Tue & Fri)', reason: 'Hot high-protein breakfast (Omelette on Tue, Egg Bhurji on Fri)' });
          messTips.push({ item: '[Breakfast] Mix Sprouts & 200ml Milk', portion: '1 bowl + 1 glass milk', reason: 'Essential micronutrients, bone calcium & casein foundation' });
          messTips.push({ item: '[Lunch Special] Egg Biryani & Egg Curry', portion: '2 eggs with rice (Wed & Sat)', reason: 'Egg Biryani (Wed lunch) & Egg Curry with Dal (Sat lunch)' });
          messTips.push({ item: '[Lunch] Dal Tadka / Panchratna + Curd', portion: '2 bowls dal + 1 cup curd', reason: 'Digestive cooling, complete amino acid profile & hydration' });
          messTips.push({ item: '[Snacks - 4:30 pm] Bananas & 200ml Milk', portion: '1-2 bananas 45m pre-gym', reason: 'Fast-digesting pre-workout carbohydrates from the mess snack counter' });
          messTips.push({ item: '[Dinner Special] Chicken Curry & Dal Fry', portion: '2-3 chicken pieces (Wed dinner)', reason: 'Lean poultry protein to rebuild chest & back muscle fibers' });
          messTips.push({ item: '[Dinner Special] Chicken Butter Masala', portion: '2-3 solid pieces (Fri dinner)', reason: 'Dense protein & recovery calories for high-intensity training' });
          messTips.push({ item: '[Dinner Special] Chicken Biryani & Raita', portion: 'Full plate (Sun dinner)', reason: 'High-calorie weekend refuel to prepare for Monday gym splits' });
          messTips.push({ item: '[Dinner Special] Soya Bean Masala', portion: '1 bowl (Sat dinner)', reason: 'Bonus plant-protein boost on Saturday evening' });

        e.preventDefault();
        const date = document.getElementById('trackerDateInput').value;
        const machineId = document.getElementById('trackerMachineSelect').value;
        const sets = parseInt(document.getElementById('trackerSetsInput').value, 10);
        const reps = parseInt(document.getElementById('trackerRepsInput').value, 10);
        const weight = parseFloat(document.getElementById('trackerWeightInput').value);
        const notes = document.getElementById('trackerNotesInput').value.trim();

        const machine = MACHINES_DATA.find(m => m.id === machineId);

        const newLog = {
          id: 'log_' + Date.now(),
          date,
          machineId,
          machineName: machine ? machine.name : 'Gym Exercise',
          sets,
          reps,
          weight,
          notes
        };

        this.logs.unshift(newLog);
        localStorage.setItem('scanfit_logs', JSON.stringify(this.logs));

        if (typeof confetti === 'function') {
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        }

        this.showToast(`Logged ${machine ? machine.name : 'workout'}!`);
        this.checkStreakStatus();
        this.renderTracker(document.getElementById('app-container'));
      }

      deleteLogEntry(id) {
        this.logs = this.logs.filter(item => item.id !== id);
        localStorage.setItem('scanfit_logs', JSON.stringify(this.logs));
        this.showToast('Log removed');
        this.checkStreakStatus();
        this.renderTracker(document.getElementById('app-container'));
      }

      clearAllLogs() {
        this.logs = [];
        try { localStorage.removeItem('scanfit_logs'); } catch (e) {}
        this.showToast('All workout logs cleared');
        this.checkStreakStatus();
        this.renderTracker(document.getElementById('app-container'));
      }

      // --- VIEW: IIT DHARWAD CONSISTENCY STREAKS ---
      calculateStreak() {
        if (!this.logs || this.logs.length === 0) {
          return { currentStreak: 0, bestStreak: 0, daysTrainedThisWeek: 0, currentWeekDays: this.getMonSunStatus([]), hasRestPass: true };
        }

        const uniqueDates = [...new Set(this.logs.map(l => l.date))];
        const weekMap = {};
        uniqueDates.forEach(dateStr => {
          const d = new Date(dateStr + 'T00:00:00');
          const weekKey = this.getYearWeek(d);
          weekMap[weekKey] = (weekMap[weekKey] || 0) + 1;
        });

        const now = new Date();
        const currentWeekKey = this.getYearWeek(now);
        const daysThisWeek = weekMap[currentWeekKey] || 0;

        let streak = 0;
        let cursor = new Date(now);
        if (daysThisWeek >= this.streakGoal) streak++;

        let restPassUsed = false;
        for (let i = 1; i <= 52; i++) {
          cursor.setDate(cursor.getDate() - 7);
          const wk = this.getYearWeek(cursor);
          const count = weekMap[wk] || 0;
          if (count >= this.streakGoal) {
            streak++;
          } else if (!restPassUsed) {
            restPassUsed = true;
          } else {
            break;
          }
        }

        const savedBest = parseInt(localStorage.getItem('scanfit_best_streak') || '0', 10);
        const bestStreak = Math.max(savedBest, streak);
        localStorage.setItem('scanfit_best_streak', bestStreak.toString());

        return {
          currentStreak: streak,
          bestStreak,
          daysTrainedThisWeek: daysThisWeek,
          currentWeekDays: this.getMonSunStatus(uniqueDates),
          hasRestPass: !restPassUsed
        };
      }

      getYearWeek(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        return `${d.getUTCFullYear()}-W${weekNo}`;
      }

      getMonSunStatus(uniqueDates) {
        const now = new Date();
        const currentDay = now.getDay();
        const distanceToMon = (currentDay + 6) % 7;
        const monday = new Date(now);
        monday.setDate(now.getDate() - distanceToMon);

        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        return days.map((name, idx) => {
          const d = new Date(monday);
          d.setDate(monday.getDate() + idx);
          const str = d.toISOString().split('T')[0];
          const isToday = str === now.toISOString().split('T')[0];
          const isTrained = uniqueDates.includes(str);
          return { dayName: name, dateStr: str, isToday, isTrained };
        });
      }

      renderStreaks(container) {
        const stats = this.calculateStreak();
        const goal = this.streakGoal;
        const reachedGoal = stats.daysTrainedThisWeek >= goal;

        let html = `
          <div class="space-y-6 view-animate">
            <div>
              <h1 class="font-heading text-3xl font-bold text-cream-50">Campus Consistency Streaks</h1>
              <p class="text-xs text-cream-300">Build continuous gym discipline. Rest days never break your streak.</p>
            </div>

            <!-- Big Card -->
            <div class="bg-gradient-to-br from-navy-900 via-navy-800 to-navy-700 border border-orange-accent/40 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
              <div class="flex items-center justify-between">
                <div>
                  <span class="text-xs font-semibold text-orange-accent uppercase tracking-wider block mb-1">
                    Current Streak
                  </span>
                  <div class="flex items-baseline gap-2">
                    <span class="font-heading text-5xl sm:text-6xl font-bold text-cream-50">
                      ${stats.currentStreak}
                    </span>
                    <span class="text-sm font-heading text-cream-300">WEEKS IN A ROW</span>
                  </div>
                </div>

                <div class="w-16 h-16 rounded-2xl bg-orange-accent/20 border border-orange-accent/40 flex items-center justify-center text-orange-accent text-3xl">
                  <i class="fa-solid fa-fire flame-anim"></i>
                </div>
              </div>

              <div class="mt-4 pt-4 border-t border-navy-700 flex items-center justify-between text-xs">
                <div>
                  <span class="text-cream-300">Best Streak: </span>
                  <strong class="text-cream-50 font-mono">${stats.bestStreak} weeks</strong>
                </div>
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full ${stats.hasRestPass ? 'bg-cyan-500/20 text-cyan-300' : 'bg-navy-700 text-cream-300'} text-[11px]">
                  <i class="fa-solid fa-shield-heart"></i>
                  <span>${stats.hasRestPass ? '1 Monthly Rest Pass Active' : 'Rest Pass Used'}</span>
                </div>
              </div>
            </div>

            <!-- Weekly Mon-Sun Progress -->
            <div class="bg-navy-900 border border-navy-700 rounded-3xl p-5 shadow-xl">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h3 class="font-heading text-lg font-bold text-cream-50">Weekly Progress</h3>
                  <p class="text-xs text-cream-300">
                    ${stats.daysTrainedThisWeek} of ${goal} days logged ${reachedGoal ? '• Goal Reached! 🎉' : ''}
                  </p>
                </div>

                <div class="flex items-center gap-2">
                  <label class="text-xs text-cream-300">Goal:</label>
                  <select onchange="app.changeStreakGoal(this.value)" class="bg-navy-800 border border-navy-600 rounded-lg text-xs px-2 py-1 text-cream-100 font-bold focus:outline-none focus:border-orange-accent">
                    <option value="2" ${goal === 2 ? 'selected' : ''}>2 days</option>
                    <option value="3" ${goal === 3 ? 'selected' : ''}>3 days</option>
                    <option value="4" ${goal === 4 ? 'selected' : ''}>4 days</option>
                    <option value="5" ${goal === 5 ? 'selected' : ''}>5 days</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-7 gap-1.5 sm:gap-2 text-center">
                ${stats.currentWeekDays.map(d => `
                  <div class="p-2 rounded-xl border ${d.isToday ? 'border-orange-accent bg-orange-accent/10' : 'border-navy-800 bg-navy-800/40'}">
                    <span class="text-[10px] font-bold ${d.isToday ? 'text-orange-accent' : 'text-cream-300'} block mb-1 uppercase">${d.dayName}</span>
                    <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center ${d.isTrained ? 'bg-orange-accent text-navy-950 font-bold shadow-[0_0_10px_#FF6B35]' : 'bg-navy-700 text-navy-500'}">
                      <i class="fa-solid ${d.isTrained ? 'fa-check text-xs' : 'fa-circle text-[6px]'}"></i>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Milestone Badges -->
            <div class="bg-navy-900 border border-navy-700 rounded-3xl p-5 shadow-xl">
              <h3 class="font-heading text-lg font-bold text-cream-50 mb-3">Streak Milestone Badges</h3>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                ${this.renderBadgeItem(4, 'Bronze IITD Habit', 'fa-award', stats.currentStreak)}
                ${this.renderBadgeItem(8, 'Silver Consistency', 'fa-medal', stats.currentStreak)}
                ${this.renderBadgeItem(12, 'Gold Slovex Legend', 'fa-crown', stats.currentStreak)}
              </div>
            </div>
          </div>
        `;

        container.innerHTML = html;
        }

      renderBadgeItem(weeks, title, icon, currentStreak) {
        const unlocked = currentStreak >= weeks;
        const diff = weeks - currentStreak;

        return `
          <div onclick="${unlocked ? 'app.celebrateBadge()' : ''}" class="p-4 rounded-2xl border transition ${unlocked ? 'bg-navy-800 border-orange-accent/60 cursor-pointer hover:scale-105 active:scale-95' : 'bg-navy-900/40 border-navy-800 opacity-60'} flex flex-col items-center text-center">
            <div class="w-12 h-12 rounded-2xl ${unlocked ? 'bg-orange-accent text-navy-950 shadow-[0_0_15px_#FF6B35]' : 'bg-navy-800 text-cream-300'} flex items-center justify-center text-xl mb-2">
              <i class="fa-solid ${icon}"></i>
            </div>
            <h4 class="font-heading font-bold text-sm text-cream-50">${title}</h4>
            <span class="text-[11px] font-mono text-orange-accent">${weeks} Weeks</span>
            <div class="mt-2 text-[10px] uppercase font-bold">
              ${unlocked ? '<span class="text-green-400 bg-green-500/10 px-2 py-0.5 rounded-full">Unlocked!</span>' : `<span class="text-cream-300 bg-navy-800 px-2 py-0.5 rounded-full">${diff} weeks left</span>`}
            </div>
          </div>
        `;
      }

      celebrateBadge() {
        if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 75, origin: { y: 0.6 } });
        this.showToast('Milestone Badge Active!');
      }

      changeStreakGoal(val) {
        this.streakGoal = parseInt(val, 10);
        localStorage.setItem('scanfit_goal', this.streakGoal.toString());
        this.showToast(`Weekly goal set to ${this.streakGoal} days`);
        this.renderStreaks(document.getElementById('app-container'));
      }

      checkStreakStatus() {
        const stats = this.calculateStreak();
        const dot = document.getElementById('streakNavDot');
        if (dot) {
          if (stats.currentStreak > 0) dot.classList.remove('hidden');
          else dot.classList.add('hidden');
        }
      }

      // --- VIEW: PRINTABLE 12-MACHINE QR CODE STICKERS ---
      renderAdminQr(container) {
        let html = `
          <div class="space-y-6 view-animate">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 class="font-heading text-3xl font-bold text-cream-50">Gym Machine QR Stickers</h1>
                <p class="text-xs text-cream-300">12 ready-to-print stickers to paste on campus fitness machines.</p>
              </div>
              <button onclick="window.print()" class="no-print px-4 py-2.5 bg-orange-accent hover:bg-orange-glow text-navy-950 font-bold rounded-xl text-xs flex items-center gap-2 self-start transition active:scale-95 shadow-lg">
                <i class="fa-solid fa-print"></i>
                <span>Print All 12 Stickers</span>
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              ${MACHINES_DATA.map(m => `
                <div class="qr-print-card bg-navy-900 border-2 border-dashed border-navy-700 rounded-3xl p-5 flex flex-col items-center text-center shadow-md">
                  <div class="flex items-center gap-2 mb-2">
                    <span class="font-heading text-xs font-bold text-orange-accent tracking-wider">SCANFIT • IIT DHARWAD</span>
                  </div>
                  <div id="qrCanvas_${m.id}" class="bg-white p-3 rounded-2xl shadow-inner mb-3 flex items-center justify-center"></div>
                  <h3 class="font-heading text-xl font-bold text-cream-50 mb-0.5">#${m.number} ${m.name}</h3>
                  <p class="text-[11px] text-cream-300 max-w-xs mb-2">${m.type}</p>
                  <span class="text-[10px] font-mono text-orange-accent bg-navy-800 px-2 py-0.5 rounded border border-navy-700">
                    scanfit/#/machine/${m.id}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        `;

        container.innerHTML = html;

        setTimeout(() => {
          MACHINES_DATA.forEach(m => {
            const target = document.getElementById(`qrCanvas_${m.id}`);
            if (target && typeof QRCode !== 'undefined') {
              target.innerHTML = '';
              const url = window.location.origin + window.location.pathname + `#/machine/${m.id}`;
              new QRCode(target, {
                text: url,
                width: 130,
                height: 130,
                colorDark: '#09101C',
                colorLight: '#FFFFFF',
                correctLevel: QRCode.CorrectLevel.M
              });
            }
          });
        }, 60);
      }
    }

    // Launch Application
    let app;
    window.addEventListener('DOMContentLoaded', () => {
      app = new ScanFitApp();
      app.init();
    });
  </script>
</body>
</html>
